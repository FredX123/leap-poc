<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
  <a class="navbar-brand" routerLink="/">
    <i class="bi bi-rocket-takeoff me-2"></i>LEAP POC
  </a>

  <!-- Hamburger toggler for small screens -->
  <button *ngIf="auth.isAuthenticated" class="navbar-toggler" type="button"
          (click)="navCollapsed = !navCollapsed"
          aria-controls="navbarNav" [attr.aria-expanded]="!navCollapsed" aria-label="Toggle navigation">
    <span class="navbar-toggler-icon"></span>
  </button>

  <!-- Role-based menus (only when authenticated) -->
  <div class="navbar-collapse" [class.collapse]="navCollapsed" *ngIf="auth.isAuthenticated" id="navbarNav">
    <ul class="navbar-nav me-auto">
      <li class="nav-item" *ngIf="auth.hasAnyRoleOrGroup('APP_ADMIN')">
        <a
          class="nav-link"
          routerLink="/user-management"
          routerLinkActive="active"
        >
          <i class="bi bi-people me-1"></i>User Management
        </a>
      </li>
      <li class="nav-item" *ngIf="auth.hasAnyRoleOrGroup('APP_READ', 'APP_WRITE')">
        <a
          class="nav-link"
          routerLink="/osfi-lcr-report"
          routerLinkActive="active"
        >
          <i class="bi bi-graph-up me-1"></i>OSFI LCR
        </a>
      </li>
      <li class="nav-item" *ngIf="auth.hasAnyRoleOrGroup('APP_READ', 'APP_WRITE')">
        <a
          class="nav-link"
          routerLink="/osfi-lcr-metric-report"
          routerLinkActive="active"
        >
          <i class="bi bi-graph-up-arrow me-1"></i>OSFI LCR Metric
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/admin-only" routerLinkActive="active">
          <i class="bi bi-bar-chart-line me-1"></i>Guarded [Admin]
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/write-only" routerLinkActive="active">
          <i class="bi bi-bar-chart-line me-1"></i>Guarded [Write]
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/read-only" routerLinkActive="active">
          <i class="bi bi-bar-chart-line me-1"></i>Guarded [Read]
        </a>
      </li>
    </ul>
  </div>

  <!-- Right-aligned login / logout -->
  <div class="d-flex align-items-center ms-auto gap-2">
    <span class="text-light" *ngIf="auth.isAuthenticated">
      {{ auth.user?.displayName || auth.user?.email }}
      <span *ngIf="auth.user?.mock" class="badge bg-info ms-1">Mock</span>
    </span>

    <!-- Not authenticated: mock toggle + login options -->
    <ng-container *ngIf="!auth.isAuthenticated">
      <div class="form-check form-switch mb-0">
        <input class="form-check-input" type="checkbox" id="mockToggle"
               [(ngModel)]="mockMode" (ngModelChange)="onMockToggle()">
        <label class="form-check-label text-light small" for="mockToggle">Mock Login</label>
      </div>

      <!-- Regular Entra ID login -->
      <button *ngIf="!mockMode"
              class="btn btn-outline-light btn-sm"
              (click)="auth.login()">
        <i class="bi bi-box-arrow-in-right me-1"></i>Log in
      </button>

      <!-- Mock user selector -->
      <select *ngIf="mockMode && mockUsers.length"
              class="form-select form-select-sm mock-user-select"
              (change)="mockLogin($any($event.target).value); $any($event.target).value = ''">
        <option value="" selected disabled>Select mock user...</option>
        <option *ngFor="let u of mockUsers" [value]="u.username">
          {{ u.displayName }} ({{ u.description }})
        </option>
      </select>
    </ng-container>

    <!-- Logout -->
    <button class="btn btn-outline-warning btn-sm"
            *ngIf="auth.isAuthenticated"
            (click)="onLogout()">
      <i class="bi bi-box-arrow-right me-1"></i>Log out
    </button>
  </div>
</nav>
