server:
  port: 18080

app:
  frontend-url: http://localhost:4200
  # App-only (client credentials) access to Microsoft Graph for user lookup.
  # Uses the same Entra app registration — ensure it has Application permission User.Read.All
  # with admin consent granted.
  entra:
    tenant-id: ${ENTRA_TENANT_ID}
    client-id: ${ENTRA_CLIENT_ID}
    client-secret: ${ENTRA_CLIENT_SECRET}

spring:
  datasource:
    url: jdbc:sqlserver://localhost;databaseName=leappoc;encrypt=true;trustServerCertificate=true
    username: ${MSSQL_USERNAME:sa}
    password: ${MSSQL_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          entra:
            client-id: ${ENTRA_CLIENT_ID}
            client-secret: ${ENTRA_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Microsoft Entra ID
        provider:
          entra:
            issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
            # Spring auto-discovers authorize, token, jwks, and userinfo endpoints from issuer-uri

logging:
  level:
    org.springframework.security: DEBUG
    com.leappoc: DEBUG

comment:
  max-thread-depth: 5

# Entra ID group Object IDs → mapped to GROUP_* authorities in SecurityConfig.
# Replace these GUIDs with the actual Object IDs from your Entra ID tenant.
entra:
  groups:
    GRP_ADMIN: ${ENTRA_GROUP_ADMIN:}
    GRP_WRITE: ${ENTRA_GROUP_WRITE:}
    GRP_READ:  ${ENTRA_GROUP_READ:}

