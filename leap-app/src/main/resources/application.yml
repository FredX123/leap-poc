server:
  port: 18080

app:
  frontend-url: http://localhost:4200

spring:
  datasource:
    url: jdbc:sqlserver://localhost;databaseName=leappoc;encrypt=true;trustServerCertificate=true
    username: ${MSSQL_USERNAME:sa}
    password: ${MSSQL_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
    show-sql: false
  security:
    oauth2:
      client:
        registration:
          entra:
            client-id: ${ENTRA_CLIENT_ID}
            client-secret: ${ENTRA_CLIENT_SECRET}
            scope: openid, profile, email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-name: Microsoft Entra ID
        provider:
          entra:
            issuer-uri: https://login.microsoftonline.com/${ENTRA_TENANT_ID}/v2.0
            # Spring auto-discovers authorize, token, jwks, and userinfo endpoints from issuer-uri

logging:
  level:
    org.springframework.security: DEBUG
    com.leappoc: DEBUG

comment:
  max-thread-depth: 5
